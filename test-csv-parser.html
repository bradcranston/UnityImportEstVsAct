    <script src="./src/enhanced-parser.js"></script>
    <script>
        // Simulate the CSV parser functionality
        class TestCSVParser {
            convertToCSV(jobs) {
                const headers = [
                    'Job Number',
                    'Quantity', 
                    'Description',
                    'Start Date',
                    'Estimated',
                    'Actual',
                    'Number of Stitches',
                    'Notes'
                ];
                
                let csv = headers.join(',') + '\\n';
                
                jobs.forEach(job => {
                    const row = [
                        this.escapeCSV(job.jobNumber || ''),
                        this.escapeCSV(job.qty || '1'),
                        this.escapeCSV(job.description || ''),
                        this.escapeCSV(job.startDate || ''),
                        this.escapeCSV(job.estimated || '0 Hrs 00:00'),
                        this.escapeCSV(job.actual || '0 Hrs 00:00'),
                        this.escapeCSV(job.numberOfStitches || ''),
                        this.escapeCSV(job.notes || '')
                    ];
                    csv += row.join(',') + '\\n';
                });
                
                return csv;
            }

            escapeCSV(value) {
                if (value == null) return '';
                const strValue = String(value);
                
                if (strValue.includes(',') || strValue.includes('"') || strValue.includes('\\n')) {
                    return '"' + strValue.replace(/"/g, '""') + '"';
                }
                return strValue;
            }
        }

        function runTest(data, testName) {
            try {
                const parser = new EnhancedTrackerParser();
                parser.debugMode = true;
                const jobs = parser.parseSpecificFormat(data);
                
                const csvParser = new TestCSVParser();
                const csvData = csvParser.convertToCSV(jobs);
                
                document.getElementById('result').innerHTML = \`
                    <div class="result">
                        <h2>\${testName}</h2>
                        <p><strong>Jobs Found:</strong> \${jobs.length}</p>
                        <h3>Parsed Jobs:</h3>
                        <pre>\${JSON.stringify(jobs, null, 2)}</pre>
                        <h3>CSV Output:</h3>
                        <pre>\${csvData}</pre>
                    </div>
                \`;
            } catch (error) {
                document.getElementById('result').innerHTML = \`
                    <div class="result" style="color: red;">
                        <h2>\${testName} - Error</h2>
                        <p><strong>Error:</strong> \${error.message}</p>
