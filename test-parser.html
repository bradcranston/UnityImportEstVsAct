<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parser Test</title>
</head>
<body>
    <h1>Testing Enhanced Parser</h1>
    <button onclick="runTest()">Run Test</button>
    <button onclick="runFullFileTest()">Test Full File</button>
    <button onclick="loadRawData()">Load rawdata.txt</button>
    <div id="results"></div>
    <div id="debug-output" style="background-color: #f5f5f5; padding: 10px; margin: 10px 0; max-height: 300px; overflow-y: auto;">
        <h3>Debug Output:</h3>
        <pre id="debug-text"></pre>
    </div>

    <script src="./src/enhanced-parser.js"></script>
    <script>
        // Capture console.log output
        const originalLog = console.log;
        const debugOutput = document.getElementById('debug-text');
        console.log = function(...args) {
            originalLog.apply(console, args);
            if (debugOutput) {
                debugOutput.textContent += args.join(' ') + '\n';
            }
        };

        function runTimeBlockTest() {
            if (debugOutput) debugOutput.textContent = '';
            console.log('=== TESTING TIME BLOCKS ===');
            
            const timeBlockSample = `Estimated
Actual
0 Hrs 05:00 0 Hrs 06:04
0 Hrs 03:00 0 Hrs 06:04
0 Hrs 03:00 0 Hrs 03:14`;
            
            const results = testTimeBlocks();
            document.getElementById('results').innerHTML = '<h3>Time Block Test Results:</h3><pre>' + JSON.stringify(results, null, 2) + '</pre>';
        }

        function runFullFileTest() {
            if (debugOutput) debugOutput.textContent = '';
            console.log('=== TESTING WITH SAMPLE DATA INCLUDING TIME BLOCKS ===');
            
            const fullSample = `1
383267 Embroidered Women's Qu 1/2/2025
1/2/2025
1/2/2025
5,000
Number of Stitches
6:19:13 AM
6:25:20 AM
6:25:20 AM
1
383282 Online Store Order No. 00 1/3/2025
1/3/2025
1/3/2025
3,000
Number of Stitches
6:04:34 AM
6:07:50 AM
6:07:50 AM
Page 1 of 79
Estimated
Actual
0 Hrs 05:00 0 Hrs 06:04
0 Hrs 03:00 0 Hrs 03:13`;
            
            const parser = new EnhancedTrackerParser();
            parser.debugMode = true;
            const results = parser.parseSpecificFormat(fullSample);
            
            document.getElementById('results').innerHTML = '<h3>Full Test Results:</h3><pre>' + JSON.stringify(results, null, 2) + '</pre>';
        }

        async function loadRawData() {
            if (debugOutput) debugOutput.textContent = '';
            console.log('=== LOADING rawdataBasic.txt ===');
            
            try {
                const response = await fetch('rawdataBasic.txt');
                const text = await response.text();
                console.log('Loaded', text.length, 'characters');
                
                const parser = new EnhancedTrackerParser();
                parser.debugMode = true;
                const results = parser.parseSpecificFormat(text);
                
                console.log('Parsed', results.length, 'jobs total');
                document.getElementById('results').innerHTML = 
                    '<h3>Raw Data Test Results (' + results.length + ' jobs):</h3>' +
                    '<pre>' + JSON.stringify(results.slice(0, 10), null, 2) + '</pre>' +
                    '<p>Showing first 10 jobs. Check console for full results.</p>';
                console.log('All results:', results);
            } catch (error) {
                console.error('Error loading file:', error);
                document.getElementById('results').innerHTML = '<h3>Error:</h3><pre>' + error.message + '</pre>';
            }
        }

        function runTest() {
            if (debugOutput) debugOutput.textContent = '';
            console.log('=== RUNNING BASIC TEST ===');
            
            const results = testEnhancedParser();
            document.getElementById('results').innerHTML = '<h3>Test Results:</h3><pre>' + JSON.stringify(results, null, 2) + '</pre>';
        }
    </script>
</body>
</html>
